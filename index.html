<style>
:root{
  --ink:#1b1b1f; --sub:#6b6b76; --line:#e6e4de; --bg:#faf8f4; --card:#fff;
  --accent:#c0392b; --accent-soft:#fdecea; --shadow:0 1px 2px rgba(0,0,0,.05);
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",
          "Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
     -webkit-font-smoothing:antialiased}
h1,h2,.num,.tabs{font-family:var(--round)}

header{position:sticky;top:0;z-index:10;background:rgba(250,248,244,.94);
       backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:18px 0 12px}
h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.01em}
.evidence{font-size:12px;color:var(--sub);line-height:1.6}
.evidence .nw{white-space:nowrap}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.tabs{display:inline-flex;background:#efece6;border-radius:999px;padding:3px;gap:2px}
.tabs button{font:inherit;font-weight:700;font-size:14px;border:0;cursor:pointer;
             background:transparent;color:var(--sub);padding:8px 20px;border-radius:999px}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs .n{font-size:12px;font-weight:600;opacity:.65;margin-left:6px}
input[type=search]{font:inherit;font-size:14px;padding:9px 14px;border:1px solid var(--line);
                   border-radius:999px;background:var(--card);min-width:210px;color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:13px;color:var(--sub);margin-left:auto}

main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.grid{display:grid;gap:16px 14px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
      box-shadow:var(--shadow);display:flex;flex-direction:column}
.card .ph{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;
          color:#fff;font-family:var(--round);font-weight:800;font-size:44px;
          text-shadow:0 1px 3px rgba(0,0,0,.15)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#eeece6}
.meta{padding:9px 10px 11px}
.t{font-size:12.5px;font-weight:700;line-height:1.4;
   display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.s{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.5}
.score{display:inline-block;background:var(--accent-soft);color:var(--accent);
       font-weight:800;font-size:11px;padding:1px 7px;border-radius:999px;margin-top:6px}
/* 星は5→1の順に並べる。CSSは「後ろの兄弟」しか選べないので、
   逆順にしておくと「ホバーした星より左を光らせる」が素直に書ける */
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:1px;margin-top:7px}
.stars button{font:inherit;font-size:16px;line-height:1;border:0;background:none;cursor:pointer;
              padding:1px 0;color:#d8d4cc;transition:color .1s}
.stars button.on{color:#e8a33d}
.stars:hover button{color:#d8d4cc}
.stars button:hover,.stars button:hover ~ button{color:#f0be6a}
.stars button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
.again{display:inline-block;border:1px solid var(--line);color:var(--sub);
       font-size:10.5px;padding:1px 6px;border-radius:999px;margin-left:5px}
.yr{grid-column:1/-1;font-family:var(--round);font-weight:800;font-size:15px;
    color:var(--sub);padding:14px 2px 2px;border-bottom:1px solid var(--line)}
.empty{color:var(--sub);font-size:14px;padding:40px 2px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
       font-size:11.5px;color:var(--sub);line-height:1.8}
footer a{color:var(--sub)}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 10px}
  .count{margin-left:0;width:100%}
}
</style>
</head>

<header><div class="wrap">

</div></header>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const count = document.getElementById('count');
let view = 'anime';

document.getElementById('n-anime').textContent = ANIME.length;
document.getElementById('n-movie').textContent = MOVIES.length;
document.getElementById('n-sauna').textContent = SAUNA.length;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// カバー画像が無い作品（実写映画など）は、題名の頭文字だけのタイルにする。
// 色は題名から決まるので、同じ作品はいつ見ても同じ色になる。
const TILE = ['#8e9aaf', '#a3907e', '#7f9c8b', '#9c8aa5', '#b08a72', '#7e93a3'];
const tile = t => {
  let h = 0;
  for (const ch of t) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return TILE[h % TILE.length];
};

function card(m) {
  const cover = m.cover
    ? `<img loading="lazy" src="${esc(m.cover)}" alt="">`
    : `<div class="ph" style="background:${tile(m.title)}">${esc([...m.title][0] || '?')}</div>`;
  const bits = [];
  if (m.date) bits.push(m.date.replace(/-/g, '/'));
  else if (m.year) bits.push(m.year + '年');
  // 場所が題名と同じ時は出さない（サウナは施設名がそのまま題名になる）
  const place = (m.theater || '').replace(/^TOHOシネマズ\s*/, '');
  if (place && place !== m.title) bits.push(place);
  else if (!place && m.kind) bits.push(m.kind);
  if (m.visits > 1) bits.push('通算' + m.visits + '回');
  const score = m.score != null ? `<div><span class="score">${m.score.toFixed(1)}</span>` +
    (m.times > 1 ? `<span class="again">${m.times}回</span>` : '') + '</div>'
    : (m.times > 1 ? `<div><span class="again">${m.times}回</span></div>` : '');
  return `<article class="card" data-key="${esc(m.key)}">${cover}<div class="meta">
    <div class="t">${esc(m.title)}</div>
    <div class="s">${esc(bits.join(' · '))}</div>${score}
    ${starRow(m)}</div></article>`;
}

// ── 星評価（この端末に保存される） ──────────────────────────────
const STARS_KEY = 'anime-ledger-stars-v1';
const stars = JSON.parse(localStorage.getItem(STARS_KEY) || '{}');

// カレンダーに10点満点の点数が残っている作品は、その半分を初期値として見せる。
// 星を押した時点で、その値が正としてこの端末に保存される。
const starsOf = m => stars[m.key] != null ? stars[m.key]
                   : (m.score != null ? Math.round(m.score / 2) : 0);

function starRow(m) {
  const n = starsOf(m);
  let html = `<div class="stars" role="group" aria-label="${esc(m.title)}の評価">`;
  for (let v = 5; v >= 1; v--) {
    html += `<button type="button" data-v="${v}" class="${v <= n ? 'on' : ''}"` +
            ` aria-label="星${v}つ">★</button>`;
  }
  return html + '</div>';
}

grid.addEventListener('click', e => {
  const btn = e.target.closest('.stars button');
  if (!btn) return;
  const row = btn.parentElement;
  const key = btn.closest('.card').dataset.key;
  const v = Number(btn.dataset.v);
  // 同じ星をもう一度押したら評価を取り消す。
  // 0 も残しておく（消すと、カレンダーの点数からの初期値がまた出てきてしまう）
  const shown = row.querySelectorAll('button.on').length;
  const next = shown === v ? 0 : v;
  stars[key] = next;
  localStorage.setItem(STARS_KEY, JSON.stringify(stars));
  row.querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.v) <= next));
});

function render() {
  const rows = view === 'anime' ? ANIME : view === 'movie' ? MOVIES : SAUNA;
  const needle = q.value.trim().toLowerCase();
  const hits = needle
    ? rows.filter(m => (m.title + ' ' + (m.english || '')).toLowerCase().includes(needle))
    : rows;

  count.textContent = needle ? `${hits.length}件` : `${rows.length}件`;
  if (!hits.length) { grid.innerHTML = '<p class="empty">みつかりませんでした。</p>'; return; }

  let html = '', head = null;
  for (const m of hits) {
    const g = view === 'anime' ? (m.year ? m.year + '年' : '年不明')
            : m.date ? m.date.slice(0, 4) + '年'
            : (view === 'movie' ? '劇場で観た記録がないもの' : '日付の記録なし');
    if (g !== head) { html += `<h2 class="yr">${esc(g)}</h2>`; head = g; }
    html += card(m);
  }
  grid.innerHTML = html;
}
