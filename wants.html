<style>
:root{
  --ink:#1b1b1f; --sub:#6b6b76; --line:#e6e4de; --bg:#faf8f4; --card:#fff;
  --accent:#e0342a; --want:#c98a00; --want-soft:#fdf3dd;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
     -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:rgba(224,52,42,.97);
       backdrop-filter:blur(8px);padding:16px 0 14px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
h1{font-family:var(--round);font-size:19px;font-weight:800;margin:0;color:#fff}
h1 a{color:#fff;text-decoration:none}
h1 small{font-size:12px;font-weight:600;color:#f8ddd9;margin-left:8px}
main{max-width:720px;margin:0 auto;padding:18px 20px 80px}
.actions{display:flex;gap:8px;margin-bottom:16px}
.actions button{font:inherit;font-family:var(--round);font-weight:800;font-size:13px;
  border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:10px 18px;cursor:pointer;box-shadow:var(--shadow)}
.actions .main{background:var(--accent);border-color:var(--accent);color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;
  font-family:var(--round);font-weight:800;font-size:14.5px;cursor:pointer;
  user-select:none;-webkit-user-select:none}
summary::-webkit-details-marker{display:none}
summary .n{color:var(--want);font-size:13px}
summary .chev{margin-left:auto;color:#c9c5bc;transition:transform .15s}
details[open] summary .chev{transform:rotate(90deg)}
summary .copy{font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);
  background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--sub)}
ul{list-style:none;margin:0;padding:2px 16px 12px}
li{padding:9px 2px;border-top:1px dashed #eee9df;font-size:13.5px;font-weight:600}
li small{color:var(--sub);font-weight:400;margin-left:7px;font-size:11px}
.empty{color:var(--sub);font-size:13.5px;padding:30px 4px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:10px 20px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>

const local = JSON.parse(localStorage.getItem('quest-checks-v1') || '{}');
const verdictOf = (slug, id) =>
  (local[slug] || {})[id] || (QUEST.base[slug] || {})[id] || '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const groups = QUEST.packs.map(p => ({
  p, items: p.items.filter(it => verdictOf(p.slug, it.id) === 'want')
})).filter(g => g.items.length);
const total = groups.reduce((n, g) => n + g.items.length, 0);
document.getElementById('total').textContent = total ? `全${total}件` : '';

document.getElementById('cats').innerHTML = groups.length ? groups.map((g, i) => `
  <details${i === 0 ? ' open' : ''} data-slug="${esc(g.p.slug)}">
    <summary>${g.p.icon} ${esc(g.p.name)}<span class="n">${g.items.length}件</span>
      <button class="copy" type="button">コピー</button><span class="chev">›</span></summary>
    <ul>${g.items.map(it => `<li>${esc(it.t)}${it.s ? `<small>${esc(String(it.s))}</small>` : ''}</li>`).join('')}</ul>
  </details>`).join('')
  : '<p class="empty">まだ💛が付いていません。トップのパックでスワイプ（上方向）すると、ここに人生のやりたいことが並びます。</p>';

const listText = gs => '💛 やりたいことリスト\n\n' + gs.map(g =>
  `${g.p.icon} ${g.p.name}（${g.items.length}件）\n` +
  g.items.map(it => `・${it.t}${it.s ? `（${it.s}）` : ''}`).join('\n')).join('\n\n');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1800);
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + 'をコピーした！'); }
  catch (e) {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast(label + 'をコピーした！');
  }
}

document.getElementById('copyall').addEventListener('click', () =>
  copyText(listText(groups), '全カテゴリ'));
document.getElementById('share').addEventListener('click', async () => {
  const text = listText(groups);
  if (navigator.share) {
    try { await navigator.share({ text }); } catch (e) { /* キャンセルは無視 */ }
  } else {
    copyText(text, 'シェア用テキスト');
  }
});
document.getElementById('cats').addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if (!btn) return;
  e.preventDefault();   // detailsの開閉に化けないように
  const g = groups.find(x => x.p.slug === btn.closest('details').dataset.slug);
  copyText(listText([g]), g.p.name);
});
