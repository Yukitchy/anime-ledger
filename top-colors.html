<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やりたいことリスト 色味5案</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8e6e0;color:#1b1b1f;
     font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
     -webkit-font-smoothing:antialiased}
.picker{position:sticky;top:0;z-index:30;background:rgba(232,230,224,.97);
  backdrop-filter:blur(8px);padding:10px 14px;display:flex;gap:6px;overflow-x:auto;
  border-bottom:1px solid #d5d2ca}
.picker button{font:inherit;font-weight:700;font-size:12.5px;border:1.5px solid #d5d2ca;
  background:#fff;color:#6b6b76;padding:8px 13px;border-radius:999px;cursor:pointer;
  white-space:nowrap}
.picker button[aria-selected=true]{background:#1b1b1f;border-color:#1b1b1f;color:#fff}
.note{max-width:420px;margin:10px auto 40px;font-size:12px;color:#555;line-height:1.7;
  padding:0 6px}

.frame{max-width:420px;margin:14px auto 8px;border-radius:22px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.14);background:var(--bg);color:var(--ink);
  padding:0 0 26px}
.head{padding:22px 18px 0}
h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.01em;color:var(--title,var(--ink))}
.qstats{font-size:12px;color:var(--sub);margin:8px 0 0}
.qstats b{color:var(--stat,var(--ink))}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 0}
.bigcard{position:relative;border-radius:var(--cardr,16px);overflow:hidden;aspect-ratio:4/5;
  background:#b9b5ac;border:var(--cardb,0) solid var(--cardbc,transparent)}
.bigcard.wide{grid-column:1/-1;aspect-ratio:2.15/1}
.fan{position:absolute;inset:0;display:flex}
.fan img{flex:1;object-fit:cover;min-width:0}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:linear-gradient(178deg,rgba(0,0,0,.04) 40%,rgba(0,0,0,.72))}
.lab{position:absolute;left:13px;right:13px;bottom:11px;color:#fff}
.lab b{font-size:15px;display:block;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.lab span{font-size:10.5px;opacity:.88}
.pct{position:absolute;top:10px;right:10px;background:var(--pctbg,rgba(255,255,255,.94));
  color:var(--pctink,#1b1b1f);font-weight:800;font-size:12px;border-radius:999px;padding:4px 10px}

/* ── A シネマダーク ── */
.t-a{--bg:#141318;--ink:#f4f2ee;--sub:#a9a5b3;--stat:#fff;
     --pctbg:rgba(255,255,255,.16);--pctink:#fff}
.t-a .pct{backdrop-filter:blur(4px)}
.t-a h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;
  background:#e04a3a;margin-top:8px}

/* ── B レッドバナー ── */
.t-b{--bg:#faf6ef;--ink:#241d1b;--sub:#8a7f78;--pctbg:#c0392b;--pctink:#fff}
.t-b .head{background:#c0392b;padding:24px 18px 18px;--title:#fff;--sub:#f3cfc9;--stat:#fff}
.t-b .head h1{color:#fff}
.t-b .shelf{margin-top:2px}

/* ── C ポップソルベ ── */
.t-c{--bg:#fffdf4;--ink:#26222e;--sub:#7d7692;--cardr:18px;--cardb:3px}
.t-c .bigcard:nth-child(6n+1){--cardbc:#ff8a70}.t-c .bigcard:nth-child(6n+1) .pct{background:#ff8a70;color:#fff}
.t-c .bigcard:nth-child(6n+2){--cardbc:#4fb6a7}.t-c .bigcard:nth-child(6n+2) .pct{background:#4fb6a7;color:#fff}
.t-c .bigcard:nth-child(6n+3){--cardbc:#f2b83b}.t-c .bigcard:nth-child(6n+3) .pct{background:#f2b83b;color:#fff}
.t-c .bigcard:nth-child(6n+4){--cardbc:#9b7fe8}.t-c .bigcard:nth-child(6n+4) .pct{background:#9b7fe8;color:#fff}
.t-c .bigcard:nth-child(6n+5){--cardbc:#ef7fae}.t-c .bigcard:nth-child(6n+5) .pct{background:#ef7fae;color:#fff}
.t-c .bigcard:nth-child(6n+6){--cardbc:#5aa9e6}.t-c .bigcard:nth-child(6n+6) .pct{background:#5aa9e6;color:#fff}
.t-c h1{background:linear-gradient(90deg,#ff8a70,#9b7fe8);-webkit-background-clip:text;
  background-clip:text;color:transparent}

/* ── D クラフト紙 ── */
.t-d{--bg:#efe4d3;--ink:#41321f;--sub:#8c7a61;--stat:#41321f;
     --cardr:12px;--pctbg:#41321f;--pctink:#f5ecdd}
.t-d .frame-inner{background:
  repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(122,96,60,.03) 4px)}
.t-d h1{letter-spacing:.06em}
.t-d h1::before{content:"─ ";color:#b0713c}
.t-d h1::after{content:" ─";color:#b0713c}

/* ── E グラデーションモダン ── */
.t-e{--bg:#fbfaff;--ink:#221f33;--sub:#8781a3;--pctbg:#fff;--pctink:#6a4fd0}
.t-e .head{background:linear-gradient(115deg,#ff7e5f 0%,#c05aa8 55%,#6a4fd0 100%);
  padding:26px 18px 20px;--title:#fff;--sub:rgba(255,255,255,.85);--stat:#fff;
  border-radius:0 0 26px 26px}
.t-e .head h1{color:#fff}
.t-e .bigcard{box-shadow:0 4px 16px rgba(106,79,208,.14)}
</style>
</head>
<body class="t-a">
<div class="picker" id="picker">
  <button data-t="t-a" aria-selected="true">A シネマダーク</button>
  <button data-t="t-b" aria-selected="false">B レッドバナー</button>
  <button data-t="t-c" aria-selected="false">C ポップソルベ</button>
  <button data-t="t-d" aria-selected="false">D クラフト紙</button>
  <button data-t="t-e" aria-selected="false">E グラデーション</button>
</div>
<div class="frame"><div class="frame-inner">
  <div class="head">
    <h1>やりたいことリスト</h1>
    <p class="qstats">観た・行った・やったの棚卸し ── <b>✅ 776</b> やった ・ <b>💛 108</b> やりたい</p>
  </div>
  <div class="shelf" id="shelf"></div>
</div></div>
<p class="note" id="note"></p>

<script>
const FP = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' +
  encodeURIComponent(f) + '?width=640';
const PACKS = [
 {n:'映画メジャー1000', wide:1, pct:5, sub:'✅ 47/1000 ・ のこり953', fan:[
  'https://image.tmdb.org/t/p/w342/auQjFBfCWSL6DpQhWVCZ6wFtDm6.jpg',
  'https://image.tmdb.org/t/p/w342/qzb0slJerd5bQgJxteJ5oAmfp09.jpg',
  'https://image.tmdb.org/t/p/w342/l1SWn7SdwvAowNfC4ojV2B9LDgs.jpg',
  'https://image.tmdb.org/t/p/w342/nftQJb9550PtYFXhmTs7XiN0QhR.jpg',
  'https://image.tmdb.org/t/p/w342/A6oeVEQ1S1e3UKAIgb7un9ioZPl.jpg']},
 {n:'アニメ人気1000', pct:73, sub:'✅ 727/1000 ・ 💛 108', fan:[
  'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx16498-C6FPmWm59CyP.jpg',
  'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101922-PEn1CTc93blC.jpg']},
 {n:'漫画人気1000', pct:0, sub:'✅ 0/1000 ・ のこり1000', fan:[
  'https://s4.anilist.co/file/anilistcdn/media/manga/cover/large/bx105778-euxXZEIfDY2u.png',
  'https://s4.anilist.co/file/anilistcdn/media/manga/cover/large/bx101517-H3TdM3g5ZUe9.jpg']},
 {n:'国', pct:0, sub:'✅ 0/193 ・ のこり193', cov:FP('The Earth seen from Apollo 17.jpg')},
 {n:'都道府県', pct:0, sub:'✅ 0/47', cov:FP('Satellite image of Japan in May 2003.jpg')},
 {n:'日本の世界遺産', pct:0, sub:'✅ 0/26',
  cov:FP('Itsukushima-jinja torii at sunset, Miyajima, Japan, 20240816 1812 4144.jpg')},
 {n:'遊園地アトラクション', pct:0, sub:'✅ 0/58', cov:FP('PHOENIX Roller Coaster 2021.jpg')},
 {n:'定番バケットリスト', pct:0, sub:'✅ 0/100', cov:FP('Hot air balloon in Cappadocia 02.jpg')},
 {n:'サウナ名店', pct:4, sub:'✅ 2/52', cov:FP('Tatsuno-yu Sento Tokyo 1.jpg')}];

document.getElementById('shelf').innerHTML = PACKS.map(p => `
  <div class="bigcard${p.wide ? ' wide' : ''}">
    ${p.fan ? `<div class="fan">${p.fan.map(u => `<img loading="lazy" src="${u}" alt="">`).join('')}</div>`
            : `<img class="cover" loading="lazy" src="${p.cov}" alt="">`}
    <div class="veil"></div><div class="pct">${p.pct}%</div>
    <div class="lab"><b>${p.n}</b><span>${p.sub}</span></div>
  </div>`).join('');

const NOTES = {
 't-a': 'A: 映画館の暗がり。ポスターの色が一番映える。夜スマホでまぶしくないのも利点。',
 't-b': 'B: ブランド赤のバナーをドン。秋葉原ツアーサイトと同じ赤系で「ユウキの世界観」に揃う。',
 't-c': 'C: カードごとに色が変わるソルベ配色。にぎやかで楽しい。子どもっぽくなるギリギリ手前を狙った。',
 't-d': 'D: クラフト紙の手帳感。あたたかくてアナログ。「人生の棚卸し」の情緒に一番合う。',
 't-e': 'E: 夕焼けグラデーションのヘッダー。今風アプリの顔。💛やりたい=夕陽の色と物語がつながる。'};
const note = document.getElementById('note');
note.textContent = NOTES['t-a'];
document.getElementById('picker').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.body.className = b.dataset.t;
  note.textContent = NOTES[b.dataset.t];
  document.querySelectorAll('.picker button').forEach(x =>
    x.setAttribute('aria-selected', String(x === b)));
});
</script>
</body>
</html>
